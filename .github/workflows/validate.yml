name: Validate BotImagen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile app.py doctor.py character_generator.py botimagen_server.py tests/test_character_generator.py tests/test_visual_style_contract.py tests/test_local_api.py tests/test_web_field_coverage.py

      - name: Validate asset manifest
        run: python tests/validate_manifest.py

      - name: Validate character generator
        run: python tests/test_character_generator.py

      - name: Validate universal visual style contract
        run: python tests/test_visual_style_contract.py

      - name: Validate local API bridge
        run: python tests/test_local_api.py

      - name: Validate web editor field coverage
        run: python tests/test_web_field_coverage.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build web interface
        working-directory: web
        run: npm run build

      - name: Install isolated Chromium smoke-test runtime
        run: |
          npm install --prefix /tmp/botimagen-playwright --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          /tmp/botimagen-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Smoke test web UI in Chromium
        env:
          BOTIMAGEN_PLAYWRIGHT_MODULE: /tmp/botimagen-playwright/node_modules/playwright/index.mjs
        run: node web/browser_smoke.mjs
