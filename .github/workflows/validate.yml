name: Validate BotImagen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Validate asset manifest
        run: python tests/validate_manifest.py
