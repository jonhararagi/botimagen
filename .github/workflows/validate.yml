name: Validate BotImagen

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Validate asset manifest
        run: python - <<'PY'
import json
from pathlib import Path

manifest = json.loads(Path("assets_manifest.json").read_text(encoding="utf-8"))
assert isinstance(manifest.get("assets"), list)
assert manifest["assets"], "assets_manifest.json must contain at least one asset"

required = {"id", "title", "destination", "expected"}
for asset in manifest["assets"]:
    missing = required - asset.keys()
    assert not missing, f"{asset.get('id', '?')}: missing {sorted(missing)}"
    assert asset["destination"].endswith(".png"), asset["id"]
    assert asset["expected"].get("format", "PNG").upper() == "PNG", asset["id"]

print(f"PASS: {len(manifest['assets'])} asset contracts validated")
PY
