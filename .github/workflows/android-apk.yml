name: BotImagen Mobile APK
on:
  push:
    branches: [feature/bimg-engine-001-cyberstreet-visual-renderer]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate mobile assets
        run: |
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/java/com/botimagen/mobile/MainActivity.java
          grep -q 'BotImagen Mobile' android/app/src/main/assets/index.html
      - name: Test PNG parts engine
        run: node --test tests/mobile-parts.test.cjs
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: botimagen-mobile-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
