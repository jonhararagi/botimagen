name: BotImagen Windows Local Web

on:
  pull_request:
    paths:
      - "Iniciar_BotImagen_Web.bat"
      - "tools/launch_web.ps1"
      - "botimagen_server.py"
      - "modular_asset_library.py"
      - "requirements-engine.txt"
      - "web/**"
      - "tests/test_local_api.py"
      - "tests/test_modular_asset_library.py"
      - ".github/workflows/windows-local-web.yml"
  push:
    branches: [feature/bimg-anime-png-universal-library]
    paths:
      - "Iniciar_BotImagen_Web.bat"
      - "tools/launch_web.ps1"
      - "botimagen_server.py"
      - "modular_asset_library.py"
      - "requirements-engine.txt"
      - "web/**"
      - "tests/test_local_api.py"
      - "tests/test_modular_asset_library.py"
      - ".github/workflows/windows-local-web.yml"
  workflow_dispatch:

jobs:
  windows-local-web:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate launcher requirements and install locked dependencies
        shell: cmd
        run: Iniciar_BotImagen_Web.bat -CheckOnly

      - name: Validate Python asset library and API on Windows
        shell: pwsh
        run: |
          python -m py_compile botimagen_server.py modular_asset_library.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_modular_asset_library.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/test_local_api.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the web interface on Windows
        shell: pwsh
        run: |
          Push-Location web
          try {
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

      - name: Start API and Vite and verify local endpoints
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $npm = (Get-Command npm.cmd -ErrorAction Stop).Source
          $apiLog = Join-Path $env:RUNNER_TEMP "botimagen-api.log"
          $webLog = Join-Path $env:RUNNER_TEMP "botimagen-vite.log"
          $apiError = Join-Path $env:RUNNER_TEMP "botimagen-api-error.log"
          $webError = Join-Path $env:RUNNER_TEMP "botimagen-vite-error.log"
          $api = $null
          $web = $null
          $ready = $false
          try {
            $api = Start-Process -FilePath $python -ArgumentList @("botimagen_server.py") -WorkingDirectory $root -PassThru -WindowStyle Hidden -RedirectStandardOutput $apiLog -RedirectStandardError $apiError
            $webCommand = 'call "' + $npm + '" run dev -- --host 127.0.0.1 --port 5173 --strictPort'
            $web = Start-Process -FilePath $env:ComSpec -ArgumentList @("/d", "/s", "/c", $webCommand) -WorkingDirectory (Join-Path $root "web") -PassThru -WindowStyle Hidden -RedirectStandardOutput $webLog -RedirectStandardError $webError
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              try {
                $null = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 2
                $page = Invoke-WebRequest -Uri "http://127.0.0.1:5173" -UseBasicParsing -TimeoutSec 2
                if ($page.StatusCode -eq 200 -and $page.Content -match "BotImagen Studio") { $ready = $true; break }
              } catch {}
              if (($api -and $api.HasExited) -or ($web -and $web.HasExited)) { break }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) {
              Write-Host "--- API stdout ---"; if (Test-Path $apiLog) { Get-Content $apiLog }
              Write-Host "--- API stderr ---"; if (Test-Path $apiError) { Get-Content $apiError }
              Write-Host "--- Vite stdout ---"; if (Test-Path $webLog) { Get-Content $webLog }
              Write-Host "--- Vite stderr ---"; if (Test-Path $webError) { Get-Content $webError }
              throw "Windows smoke test could not reach both localhost services."
            }
            Write-Host "PASS: Python API health and Vite HTML responded on 127.0.0.1."
          } finally {
            foreach ($process in @($web, $api)) {
              if ($process -and -not $process.HasExited) {
                try { & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null } catch {}
              }
            }
          }
